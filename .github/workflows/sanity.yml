name: sanity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "src/**/*.yaml"
      - ".github/workflows/sanity.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "tests/special_sanity/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine
          python -m pip install --no-deps -e .

      - name: Run sanity tests
        run: pytest -q tests/special_sanity

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/verl-vla-wheel-smoke
          /tmp/verl-vla-wheel-smoke/bin/python -m pip install hydra-core
          /tmp/verl-vla-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/verl-vla-wheel-smoke/bin/python "$GITHUB_WORKSPACE/tests/special_sanity/check_wheel.py"
