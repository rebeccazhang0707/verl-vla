# ReCap ResNet-18 value-model config overrides.

# Select the value-model SFT head.
sft_type: value_model

# Disable SAC-specific model heads for value-model SFT.
sac_enable: False

# Input image size used by the ImageNet-pretrained ResNet-18.
image_size: 224

# Official Hugging Face ResNet-18 checkpoint used by the shared camera encoder.
resnet18_path: microsoft/resnet-18

# Ordered camera fields consumed by the value critic.
image_keys: [observation.images.image, observation.images.wrist_image]

# Fine-tune ResNet-18 with the value head on task-specific rollout frames.
freeze_vision_encoder: False

# Width of the trainable camera-and-state fusion layer.
fusion_hidden_dim: 256

# Canonical LIBERO proprioception width.
state_dim: 8

# Hidden dimension for the value head. Zero uses the model default.
value_head_hidden_dim: 0

# Number of bins for discretized value prediction.
value_head_num_bins: 201

# Minimum supported value target.
value_head_v_min: -1.0

# Maximum supported value target.
value_head_v_max: 0.0

# Value-head dropout probability.
value_head_dropout: 0.0
