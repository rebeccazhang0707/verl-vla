# Standalone single-step Gaussian SAC policy adapter.
# Dataset root used to initialize native LeRobot normalization processors when
# the artifact contains config only. Trained LeRobot artifacts load their saved
# processor JSON files directly.
processor_dataset_root: null

# Scale the native Gaussian standard deviation during SAC sampling.
sac_std_scale: 1.0

# Optional twin-Q critic owned by the Gaussian Actor adapter.
critic:

  # Whether to construct the critic for SAC training.
  enabled: true

  # Number of independent Q heads.
  head_num: 2

  # Hidden-layer dimensions for every Q head.
  hidden_dims: [256, 256]
