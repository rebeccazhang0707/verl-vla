# DSRL latent-noise steering (arXiv:2506.15799) freezes the native VLA and
# trains a small SAC actor over the flow-matching initial noise. The steering
# noise is stored in replay under ``steering_noise``. DSRL is mutually
# exclusive with Flow-SDE.

# Hydra configuration composition order.
defaults:

  # MLP noise-actor implementation settings.
  - /model/adapter/dsrl/actor@mlp: mlp

  # Transformer noise-actor implementation settings.
  - /model/adapter/dsrl/actor@transformer: transformer

  # CNN noise-actor implementation settings.
  - /model/adapter/dsrl/actor@cnn: cnn

  # Apply shared DSRL settings last.
  - _self_

# Master switch for DSRL noise steering.
enabled: false

# Noise-actor architecture:
#   mlp (default): an MLP trunk over the projected features and state.
#   transformer: the posttrain reference chunking actor.
#   cnn: the official-style pixel observation actor.
actor_type: mlp

# Optional explicit policy-feature width; null derives it from the model.
feature_dim: null

# Optional explicit robot-state width; null derives it from the model.
state_dim: null

# False uses one shared noise vector across the action chunk. The official DSRL
# simulation setup uses true and predicts the complete noise chunk.
noise_per_step: false

# Tanh bound of the steering noise.
noise_bound: 1.0

# Optional extra Gaussian exploration scale for online rollout sampling.
# null preserves the actor's learned stochasticity.
rollout_noise_scale: null
