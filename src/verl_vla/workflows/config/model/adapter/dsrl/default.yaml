# DSRL latent-noise steering (arXiv:2506.15799) freezes the native VLA and
# trains a small SAC actor over the flow-matching initial noise. The steering
# noise is stored in replay under ``steering_noise``. DSRL is mutually
# exclusive with Flow-SDE.

# Master switch for DSRL noise steering.
enabled: false

# Noise-actor architecture:
#   mlp (default): an MLP trunk over the projected features and state.
#   transformer: the posttrain reference chunking actor -- one token per flow
#     horizon step, mixed by a Transformer encoder (see the block further down).
actor_type: mlp

# MLP trunk widths of the noise actor (actor_type=mlp).
hidden_dims: [256, 256, 256]

# Projection width of the frozen policy features (actor_type=mlp).
feature_latent_dim: 128

# Projection width of the normalized robot state (actor_type=mlp).
state_latent_dim: 64

# Transformer geometry of the noise actor (actor_type=transformer).
d_model: 256
nhead: 8
num_encoder_layers: 1
transformer_dropout: 0.0
transformer_activation: gelu
positional_dropout: 0.0

# Initial bias of the zero-weight log-std head, i.e. the initial policy std
# (actor_type=transformer).
log_std_init: 0.0

# Optional explicit policy-feature width; null derives it from the model.
feature_dim: null

# Optional explicit robot-state width; null derives it from the model.
state_dim: null

# False uses one shared noise vector across the action chunk; true samples one
# independent vector per horizon step.
noise_per_step: false

# Tanh bound of the steering noise.
noise_bound: 1.0

# GR00T-only steering options --------------------------------------------------

# Observation feature source for the noise actor and the transformer critic:
#   gr00t (default, recommended): the frozen VLA's own mean-pooled VL prefix,
#     aligned with the flow head the noise steers.
#   dino (posttrain parity): an independent frozen DINOv2 embedding of the
#     camera frame.
feature_source: gr00t
dino_model: facebook/dinov2-base
dino_image_size: 224

# True (posttrain parity) steers only the real action DOF (action_dim); the
# padding columns of x0 are not free SAC dims, so the SAC action space stays at
# the real DOF. False (default) steers the full padded max_action_dim.
noise_real_dims_only: false

# How the x0 padding columns [action_dim:max_action_dim] are filled when
# noise_real_dims_only is set. True (default, posttrain tile_dims) tiles the
# steered block across the full width so the decode is deterministic and fully
# controlled by the actor. False (posttrain fresh_base) draws the padding fresh
# from N(0, 1) each call, which leaks base-policy noise into the decode when
# max_action_dim >> action_dim (e.g. GR1's 128 vs 26).
tile_dims: true
