# DSRL latent-noise steering (arXiv:2506.15799) freezes the native VLA and
# trains a small SAC actor over the flow-matching initial noise. The steering
# noise is stored in replay under ``steering_noise``. DSRL is mutually
# exclusive with Flow-SDE.

# Master switch for DSRL noise steering.
enabled: false

# Noise-actor architecture:
#   mlp (default): an MLP trunk over the projected features and state.
#   transformer: the posttrain reference chunking actor -- one token per flow
#     horizon step, mixed by a Transformer encoder (see the block further down).
actor_type: mlp

# MLP trunk widths of the noise actor (actor_type=mlp).
hidden_dims: [256, 256, 256]

# Projection width of the frozen policy features (actor_type=mlp).
feature_latent_dim: 128

# Projection width of the normalized robot state (actor_type=mlp).
state_latent_dim: 64

# Token width of the noise-actor Transformer (actor_type=transformer).
d_model: 256

# Attention heads of the noise-actor Transformer; must divide d_model.
nhead: 8

# Transformer encoder depth of the noise actor.
num_encoder_layers: 1

# Dropout inside the noise-actor Transformer encoder. Kept at 0 so deterministic
# (eval) steering noise stays reproducible without an explicit eval() toggle.
transformer_dropout: 0.0

# Activation of the noise-actor Transformer encoder: relu or gelu.
transformer_activation: gelu

# Dropout applied to the noise actor's positional encoding.
positional_dropout: 0.0

# Initial bias of the zero-weight log-std head, i.e. the initial policy std
# (actor_type=transformer).
log_std_init: 0.0

# Optional explicit policy-feature width; null derives it from the model.
feature_dim: null

# Optional explicit robot-state width; null derives it from the model.
state_dim: null

# False uses one shared noise vector across the action chunk; true samples one
# independent vector per horizon step.
noise_per_step: false

# Tanh bound of the steering noise.
noise_bound: 1.0
