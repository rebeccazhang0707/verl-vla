# Transformer noise-actor implementation settings.

# Transformer token width.
d_model: 256

# Attention heads; must divide d_model.
nhead: 8

# Transformer encoder depth.
num_encoder_layers: 1

# Encoder dropout. Zero keeps deterministic steering reproducible even when the
# online rollout does not explicitly switch the actor to eval mode.
dropout: 0.0

# Transformer encoder activation: relu or gelu.
activation: gelu

# Positional-encoding dropout.
positional_dropout: 0.0

# Initial bias of the zero-weight log-standard-deviation head.
log_std_init: 0.0
