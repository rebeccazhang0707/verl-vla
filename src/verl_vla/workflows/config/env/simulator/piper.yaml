# Dual Piper X environment backed exclusively by QuestArm ROS.

# Target class instantiated from this configuration.
_target_: verl_vla.envs.piper.config.PiperConfig

# Simulator backend selected by EnvWorker.
simulator_type: piper

# SocketCAN channels for the physical left and right arms, in that order.
can_channels:

  - can_right
  - can_left

# Conda initialization script used by the managed QuestArm subprocess. An empty
# path discovers a standard Miniconda or Anaconda installation.
ros_conda_sh: ''

# Conda environment containing ROS Humble and QuestArm dependencies.
ros_conda_env: vt

# QuestArm workspace setup script. An empty path discovers setup.sh's default.
questarm_setup_path: ''

# Scale applied to QuestArm WebXR position deltas.
position_scale: 1.25

# Scale applied to QuestArm WebXR rotation deltas.
rotation_scale: 1.25

# Per-step keyboard translation delta in meters.
keyboard_position_step: 0.02

# Per-step keyboard rotation delta in radians.
keyboard_rotation_step: 0.10

# QuestArm IK position objective weight.
ik_position_weight: 5.0

# QuestArm IK smoothing objective weight.
ik_smooth_weight: 0.5

# Task string published in observations and recordings.
task_description: Teleoperate the Piper arms.

# Maximum gripper opening width in meters.
gripper_open_width: 0.1

# Minimum gripper opening width in meters.
gripper_close_width: 0.0

# Relative gripper width change per teleop step in meters.
gripper_width_step: 0.005

# Gripper force passed through ROS to agx_arm_ctrl.
gripper_force: 1.0

# V4L2 camera device for each published image stream.
camera_devices:

  - /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Dabai_DC1_CC1N16200MD-video-index0
  - /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Dabai_DC1_CC1N162035J-video-index0
  - /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Dabai_DC1_CC1N16202MR-video-index0

# Observation image name for each configured camera.
camera_names:

  - dabai_00md
  - dabai_035j
  - dabai_02mr

# Captured image height in pixels.
image_height: 240

# Captured image width in pixels.
image_width: 320

# Requested camera capture rate in frames per second.
camera_fps: 20

# Requested camera pixel format.
camera_fourcc: MJPG
