# ACT SFT composition for the official LIBERO Spatial dataset.
hydra:
  searchpath:
    - pkg://verl_vla.workflows.config

defaults:
  - /train/sft@_global_
  - override /model/override@cluster.actor_rollout_ref.model.override_config: act
  - override /model/adapter@cluster.actor_rollout_ref.model.adapter: act
  - _self_

cluster:
  checkpoint:
    default_local_dir: ./outputs/train/act-sft/official-libero-spatial/checkpoints

  actor_rollout_ref:
    model:
      load_tokenizer: false
      adapter:
        processor_dataset_root: ${data.root}

    actor:
      fsdp_config:
        reshard_after_forward: false
        wrap_policy:
          transformer_layer_cls_to_wrap:
            - ACTEncoderLayer
            - ACTDecoderLayer

data:
  action_delta_steps: 10

trainer:
  project_name: act-sft
  experiment_name: official-libero-spatial
  save_freq: 500

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        TENSORBOARD_DIR: ./outputs/train/act-sft/official-libero-spatial/tensorboard
